name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Syntax check
        run: |
          find lib bin test -name '*.rb' -print0 | xargs -0 -n1 ruby -c >/dev/null
      - name: Test
        run: bundle exec rake test
      - name: Smoke test the executable
        run: |
          ruby -Ilib bin/php2shell --version
          COLUMNS=80 ruby -Ilib bin/php2shell --dry-run https://example.com/ >/dev/null
      - name: Build and install the gem
        if: matrix.ruby == '3.4'
        run: |
          gem build php2shell_poc2026.gemspec
          gem install --local php2shell_poc2026-*.gem
          php2shell --version

  minimum:
    name: Minimum Ruby 2.7
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.7"
          bundler-cache: false
      - name: Install test dependency
        run: gem install minitest -v 5.25.5 --no-document
      - name: Test without Bundler
        run: ruby -Ilib -Itest -e 'Dir["test/**/*_test.rb"].sort.each { |f| require File.expand_path(f) }'
      - name: Smoke test the executable
        run: |
          ruby -Ilib bin/php2shell --version
          COLUMNS=80 ruby -Ilib bin/php2shell --dry-run https://example.com/ >/dev/null

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: php2shell-poc2026:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm php2shell-poc2026:test --version
          docker run --rm php2shell-poc2026:test --dry-run https://example.com/ >/dev/null
