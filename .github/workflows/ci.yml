name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Syntax check
        run: |
          find lib bin test -name '*.rb' -print0 | xargs -0 -n1 ruby -c >/dev/null
      - name: Test
        run: bundle exec rake test
      - name: Smoke test the executable
        run: |
          ruby -Ilib bin/php2shell-poc2026 --version
          COLUMNS=80 ruby -Ilib bin/php2shell-poc2026 --dry-run https://example.com/ >/dev/null
      - name: Build gem
        run: gem build php2shell_poc2026.gemspec

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: php2shell-poc2026:test
